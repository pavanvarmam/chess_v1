<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Game</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/js/all.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script src="js/home/home.js"></script>
    <link rel="stylesheet" href="/styles/home.css">
</head>
<body>
    <div class="main-layout">
        <div class="form-layout-main">
            <div class="form-layout-main-header fs-1">
                Welcome <i class="fa-solid fa-chess-king"></i>
            </div>
            <form id="myForm" class="form-layout fs-4" action="/game/online" method="get">
                <input class="form-control" name="p1-name" id="p1-name" type="text" placeholder="Enter P-1 Name (You)" required>
                <input class="form-control" name="p2-name" id="p2-name" type="text" placeholder="Enter P-2 Name (Friend)" required>

                <!-- This section is for time selction -->
                <div class="btn-group" role="group" aria-label="Basic radio toggle button group">
                    <input type="radio" class="btn-check" name="player-color" value="white" id="btnradio1" autocomplete="off" checked>
                    <label class="btn btn-outline-dark" for="btnradio1">P-1(You) as White</label>
                    
                    <input type="radio" class="btn-check" name="player-color" value="black" id="btnradio2" autocomplete="off">
                    <label class="btn btn-outline-dark" for="btnradio2">P-1(You) as Black</label>
                </div>

                <!-- This section is for time selction -->
                <div class="btn-group" role="group" aria-label="Basic radio toggle button group">
                    <input type="radio" class="btn-check" name="session-time" value="20" id="btnradio3" autocomplete="off" checked>
                    <label class="btn btn-outline-primary" for="btnradio3">20 Min</label>
                    
                    <input type="radio" class="btn-check" name="session-time" value="30" id="btnradio4" autocomplete="off">
                    <label class="btn btn-outline-primary" for="btnradio4">30 Min</label>
                    
                    <input type="radio" class="btn-check" name="session-time" value="45" id="btnradio5" autocomplete="off">
                    <label class="btn btn-outline-primary" for="btnradio5">45 Min</label>
                </div>
                <button class="btn btn-success">
                    Go for Online
                </button>
                <a class="nav-link text-primary text-center" href="/game/offline">Go for Offline</a>
            </form>
        </div>
    </div>
</body>
</html>
